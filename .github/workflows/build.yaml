name: Build Docker
on:
  push:
    branches:
    - main
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      run: |
        docker build \
        -t ghcr.io/alfredobraga/api:${{ github.sha }} .
    - name: Push
      run: |
        docker push \
        ghcr.io/alfredobraga/api:${{ github.sha }}